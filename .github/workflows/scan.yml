# Scan automatique via Apify (les IP GitHub sont généralement bloquées par Vinted).
# Prérequis : Settings > Secrets and variables > Actions > New secret : APIFY_TOKEN
# Le snapshot data/latest_scan.parquet est commité -> l'app Streamlit Cloud se met à jour toute seule.
name: Scan Vinted
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6-21/3 * * *"   # toutes les 3 h entre 7h et 22h (heure de Paris en hiver)
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    if: ${{ vars.SCAN_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m vinted_tracker scan --source apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Commit du snapshot
        run: |
          git config user.name "vinted-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest_scan.parquet
          git diff --cached --quiet || git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
